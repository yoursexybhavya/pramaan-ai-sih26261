<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRAMAAN-AI Offline Prototype</title>
<style>body{margin:0;background:#f3f8f8;color:#142638;font:14px system-ui}.wrap{max-width:1180px;margin:auto;padding:28px}.head{background:#102d45;color:white;padding:26px;border-radius:14px}.head h1{margin:0;color:#eaa35f}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid #dce6ea;border-radius:12px;padding:18px}.pill{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf2f3}.bar{width:55%;height:9px;background:#e7eef0;border-radius:9px}.bar i{display:block;height:100%;background:#087f82;border-radius:9px}.flag{padding:10px;margin:7px 0;background:#fff5f4;border-left:4px solid #c94b4b}.green{color:#17835e}.amber{color:#c58a20}.heat{width:100%;border-radius:7px}.mono{font:11px ui-monospace,monospace;word-break:break-all;color:#49616f}</style>
<div class="wrap"><div class="head"><div style="font-size:11px;letter-spacing:.12em">SMART INDIA HACKATHON · SIH26261</div><h1>PRAMAAN-AI</h1><div>Offline evidence-linked prototype · AI advises, the human decides</div></div><div id="root">Loading demo report…</div></div>
<script>fetch('../output/demo_report.json').then(r=>r.json()).then(r=>{document.querySelector('#root').innerHTML=`<div class="grid"><div><div class="card"><h2>Demo application <span class="amber">${r.score}/100 · ${r.band}</span></h2><p>Hard gate: ${r.hard_gate}. Every flag below links to the engine and source evidence.</p>${Object.entries(r.pillars).map(([k,v])=>`<div class="pill"><b>${k}</b><span class="bar"><i style="width:${v}%"></i></span><b>${v}</b></div>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Evidence-linked flags (${r.flags.length})</h2>${r.flags.map(f=>`<div class="flag"><b>${f.severity} · ${f.engine} · ${f.code}</b><br>${f.message}</div>`).join('')}</div></div><div><div class="card"><h2>Forensics</h2><p>Clean certificate · risk ${r.forensics.clean.risk}</p><img class="heat" src="../assets/ela_clean_heatmap.png"><p>Tampered certificate · risk <b>${r.forensics.tampered.risk}</b></p><img class="heat" src="../assets/ela_forged_heatmap.png"></div><div class="card" style="margin-top:18px"><h2>Audit chain <span class="green">VALID</span></h2><p>${r.audit.length} entries · SHA-256 linked</p><div class="mono">${r.audit.map(x=>x.action+' · '+x.hash).join('<br>')}</div></div></div></div>`}).catch(e=>document.querySelector('#root').textContent='Run python3 ../engine/pramaan_engine.py first.') </script>
